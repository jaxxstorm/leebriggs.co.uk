name: Site checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7b48e00e99515f8a6ecb53459862caa9fb0da7ad
        with:
          bundler-cache: true
      - run: bundle exec rake test
      - run: bundle exec rake audit
